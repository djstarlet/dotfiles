# Disable auto-hiding of the mouse cursor (default 3.0 hides after 3s idle).
mouse_hide_wait 0

# Transparency: 60% opaque, adjustable at runtime (ctrl+shift+a then m/l).
background_opacity 0.6
dynamic_background_opacity yes

# Optional: blur whatever is behind transparent kitty windows (Wayland/Hyprland).
# Uncomment to enable:
# background_blur 20

# Pastes never auto-run commands: paste-actions.py unconditionally joins all
# pasted lines with spaces, so a paste can never act as Enter. Stray
# escape/CR bytes in the clipboard are neutralized.
paste_actions filter,quote-urls-at-prompt,replace-dangerous-control-codes,confirm,confirm-if-large
