# Sourced Configurations (nwg-displays writes to monitors.conf)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/plugins-experiments.conf

# Cursor
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

# Plugins
plugin = /usr/lib/hyprland-plugins/hyprexpo.so

# Startup
exec-once = ~/.config/ags/start-bar.sh
exec-once = albert
exec-once = hyprpm reload -n
exec-once = ~/.config/hypr/scripts/start-wallpaper.sh
exec-once = wl-paste --watch wl-clip-persist --clipboard regular
exec-once = gentoo-pipewire-launcher

# Input
input {
    kb_layout = us
    follow_mouse = 0
}

# General
general {
    gaps_in = 3
    gaps_out = 10
    resize_on_border = true
    # Metallic white/grey gradient borders for all windows.
    border_size = 2
    col.active_border = rgba(ffffffff)
    col.inactive_border = rgba(939daaff)
}

decoration {
    rounding = 6
    shadow {
        enabled = true
        range = 16
        render_power = 2
        color = rgba(cfe5ff22)
        color_inactive = rgba(0000002a)
    }
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

misc {
    force_default_wallpaper = 0
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}

animations {
    enabled = 1
    bezier = default, 0.12, 0.92, 0.08, 1.0
    bezier = wind, 0.12, 0.92, 0.08, 1.0
    bezier = overshot, 0.18, 0.95, 0.22, 1.03
    bezier = graceful, 0.22, 1.0, 0.36, 1.0
    bezier = liner, 1, 1, 1, 1
    bezier = barSlideIn, 0.18, 1.08, 0.28, 1.0

    animation = windows, 1, 5, wind, popin 60%
    animation = windowsIn, 1, 6, overshot, popin 60%
    animation = windowsOut, 1, 5, graceful, popin 72%
    animation = windowsMove, 1, 5, graceful, slide
    animation = layers, 1, 4, default, slide
    animation = layersIn, 1, 5, barSlideIn, slide
    animation = layersOut, 1, 4, default, slide
    animation = fadeIn, 1, 7, default
    animation = fadeOut, 1, 7, default
    animation = fadeSwitch, 1, 7, default
    animation = fadeShadow, 0
    animation = fadeDim, 1, 7, default
    animation = fadeLayers, 1, 7, default
    animation = workspaces, 1, 5, overshot, slidevert
    animation = border, 0
    animation = borderangle, 0
}

$mainMod = SUPER

bind = $mainMod, Q, exec, kitty
bind = ALT, SPACE, exec, albert show
bind = $mainMod, F, exec, librewolf
bind = $mainMod, E, exec, pcmanfm

bind = $mainMod, V, togglefloating,
bind = SUPER, F4, exec, ~/.config/hypr/scripts/close-window-epic.sh
bind = $mainMod, C, exec, ~/.config/hypr/scripts/close-window-epic.sh
bind = $mainMod SHIFT, C, exec, ~/.config/hypr/scripts/force-kill-active.sh
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, Tab, exec, hyprctl dispatch hyprexpo:expo toggle
bind = SUPER SHIFT, grave, exec, hyprctl reload

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Utils
bind = , Print, exec, grimblast --notify copy screen
bind = SHIFT, Print, exec, grimblast --notify save area
bind = $mainMod SHIFT, S, exec, grimblast --notify copy area

# Layout Change
bind = $mainMod, L, exec, hyprctl keyword general:layout "dwindle"
bind = $mainMod SHIFT, L, exec, hyprctl keyword general:layout "master"

# Window Rules (Modern Unified Syntax)
windowrule = match:title ^(Choose Wallpaper)$, float 1, center 1
windowrule = match:class ^(org\.freedesktop\.impl\.portal\.desktop\.hyprland)$, float 1, center 1
windowrule = match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol)$, float 1, center 1
windowrule = match:title ^(Select Color|Select a Color)$, float 1, center 1
windowrule = match:class ^(ags|gjs)$, float 1, center 1
windowrule = match:class ^(nwg-displays)$, float 1, center 1, size 80% 80%